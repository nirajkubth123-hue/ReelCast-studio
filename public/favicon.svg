<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Dark rounded background for crisp contrast in browser tabs -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B" />
      <stop offset="100%" stop-color="#09090B" />
    </linearGradient>

    <!-- Vibrant R Logo Main Gradient -->
    <linearGradient id="favRGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="35%" stop-color="#3B82F6" />
      <stop offset="70%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#F97316" />
    </linearGradient>

    <!-- Speed bars -->
    <linearGradient id="favSpeed1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#F43F5E" />
    </linearGradient>
    <linearGradient id="favSpeed2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Waves -->
    <linearGradient id="favWave" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#D946EF" />
    </linearGradient>
  </defs>

  <!-- Container Base -->
  <rect width="100" height="100" rx="22" fill="url(#bgGrad)" />

  <!-- Speed bars on left -->
  <rect x="8" y="32" width="13" height="4.5" rx="2.25" fill="url(#favSpeed1)" />
  <rect x="5" y="40" width="16" height="4.5" rx="2.25" fill="url(#favSpeed2)" />
  <rect x="9" y="48" width="12" height="4.5" rx="2.25" fill="#EF4444" />

  <!-- Broadcast curves on right -->
  <path d="M 77 34 A 20 20 0 0 1 77 56" stroke="url(#favWave)" stroke-width="4.5" stroke-linecap="round" fill="none" />
  <path d="M 85 28 A 30 30 0 0 1 85 62" stroke="url(#favWave)" stroke-width="4.5" stroke-linecap="round" fill="none" opacity="0.8" />

  <!-- Stylized R -->
  <path d="
    M 26 22
    C 26 19, 29 16, 33 16
    L 59 16
    C 72 16, 80 25, 80 39
    C 80 50, 72 57, 61 60
    L 76 81
    C 78 83, 76 86, 73 86
    L 58 86
    C 56 86, 54 85, 53 83
    L 42 64
    L 38 64
    L 38 84
    C 38 86, 36 88, 34 88
    L 28 88
    C 26 88, 24 86, 24 84
    Z
  " fill="url(#favRGrad)" />

  <!-- White Play Button inside R -->
  <polygon points="41,27 61,39 41,51" fill="#FFFFFF" />
</svg>
